<style>
    #tile {
        font-family: inherit;
        font-size: inherit;
        display: flex;
        flex-direction: column;
        gap: 0.8em;
        box-sizing: border-box;
        overflow-y: auto;
        padding-right: 0.7em;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--content-color) 30%, transparent) transparent;
    }

    #tile::-webkit-scrollbar {
        width: 0.35em;
    }

    #tile::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--content-color) 30%, transparent);
        border-radius: 0.2em;
    }

    #tile::-webkit-scrollbar-thumb:hover {
        background: var(--accent-color);
    }

    .label {
        font-size: 0.8em;
        color: color-mix(in srgb, var(--content-color) 60%, transparent);
    }

    .price {
        font-size: 2.4em;
        font-weight: 700;
        line-height: 1.1;
    }

    .deltas {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6em;
    }

    .delta {
        padding: 0.2em 0.7em;
        border-radius: 1em;
        font-size: 0.85em;
        background: color-mix(in srgb, var(--content-color) 10%, transparent);
    }

    .delta.up {
        color: #e0483e;
    }

    .delta.down {
        color: #2eb85c;
    }

    .chart {
        width: 100%;
        height: 6em;
        flex: 1 1 6em;
        min-height: 4em;
    }

    .chart path.line {
        fill: none;
        stroke: var(--accent-color);
        stroke-width: 2;
        vector-effect: non-scaling-stroke;
    }

    .chart path.area {
        fill: color-mix(in srgb, var(--accent-color) 18%, transparent);
        stroke: none;
    }

    .chart circle {
        fill: var(--accent-color);
    }

    .range {
        display: flex;
        justify-content: space-between;
        font-size: 0.8em;
    }

    .bar {
        height: 0.5em;
        border-radius: 0.25em;
        background: color-mix(in srgb, var(--content-color) 12%, transparent);
        overflow: hidden;
    }

    .bar > div {
        height: 100%;
        background: var(--accent-color);
    }

    #empty {
        display: none;
        opacity: 0.7;
    }
</style>

<div id="tile">
    <div id="empty"></div>
    <div id="content">
        <div class="label" id="priceLabel"></div>
        <div class="price" id="price"></div>
        <div class="deltas" id="deltas"></div>
    </div>
    <svg class="chart" id="chart" viewBox="0 0 100 40" preserveAspectRatio="none"></svg>
    <div class="range" id="range"></div>
    <div id="demandBox">
        <div class="label"><span id="demandLabel"></span>: <span id="demand"></span></div>
        <div class="bar"><div id="demandBar"></div></div>
    </div>
</div>

<script>
    var tile = document.getElementById('tile');

    function fitTile() {
        var style = getComputedStyle(document.body);
        var margins = parseFloat(style.marginTop) + parseFloat(style.marginBottom);
        tile.style.height = (window.innerHeight - margins) + 'px';
    }
    window.addEventListener('resize', fitTile);
    fitTile();

    function money(value) {
        return value.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €';
    }

    function delta(label, value) {
        if (value === null || value === undefined) {
            return '';
        }
        var cls = value > 0 ? 'up' : (value < 0 ? 'down' : '');
        var arrow = value > 0 ? '▲ +' : (value < 0 ? '▼ ' : '● ');
        return '<span class="delta ' + cls + '">' + arrow + money(value) + ' ' + label + '</span>';
    }

    function drawChart(series) {
        var min = Math.min.apply(null, series);
        var max = Math.max.apply(null, series);
        var span = (max - min) || 1;
        var points = series.map(function (value, index) {
            var x = series.length > 1 ? index * 100 / (series.length - 1) : 50;
            var y = 36 - ((value - min) / span) * 32;
            return [x, y];
        });
        var line = points.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2); }).join(' ');
        var area = line + ' L100 40 L0 40 Z';
        var last = points[points.length - 1];
        document.getElementById('chart').innerHTML =
            '<path class="area" d="' + area + '"/><path class="line" d="' + line + '"/>' +
            '<ellipse cx="' + last[0] + '" cy="' + last[1] + '" rx="1.6" ry="4" style="fill: var(--accent-color)"/>';
    }

    function handleMessage(data) {
        var d = JSON.parse(data);
        var t = d.texts || {};
        var hasData = d.series && d.series.length > 0;

        document.getElementById('empty').style.display = hasData ? 'none' : 'block';
        document.getElementById('empty').textContent = t.empty || '';
        ['content', 'chart', 'range', 'demandBox'].forEach(function (id) {
            document.getElementById(id).style.display = hasData ? '' : 'none';
        });
        if (!hasData) {
            return;
        }

        document.getElementById('priceLabel').textContent = t.price;
        document.getElementById('price').textContent = money(d.price);
        document.getElementById('deltas').innerHTML = delta(t.day, d.day) + delta(t.week, d.week);
        drawChart(d.series);
        document.getElementById('range').innerHTML =
            '<span>' + t.low + ' ' + money(d.min) + '</span>' +
            '<span>' + (t.range || '').replace('%d', d.series.length) + '</span>' +
            '<span>' + t.high + ' ' + money(d.max) + '</span>';
        document.getElementById('demandLabel').textContent = t.demand;
        document.getElementById('demand').textContent = d.demand + ' %';
        document.getElementById('demandBar').style.width = Math.max(0, Math.min(100, d.demand)) + '%';
    }
</script>
